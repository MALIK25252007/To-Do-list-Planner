<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily To-Do Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-bg"></div>
    <div class="container">
        <header class="hero">
            <div>
                <span class="subtitle">Daily Planner</span>
                <h1>My To-Do List</h1>
                <p>Keep your day organized with quick task adds and completion tracking.</p>
            </div>
            <div class="stats">
                <div>
                    <strong id="total-count">0</strong>
                    <span>Tasks</span>
                </div>
                <div>
                    <strong id="completed-count">0</strong>
                    <span>Completed</span>
                </div>
            </div>
        </header>

        <form class="todo-form">
            <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off" />
            <button type="submit" class="btn">Add Task</button>
        </form>

        <section class="task-panel">
            <div class="task-header">
                <h2>Today's Tasks</h2>
                <button type="button" class="clear-btn">Clear Completed</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
            <p class="empty-state">No tasks yet. Add your first task to begin.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
